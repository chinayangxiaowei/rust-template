[package]
name = "example_seed"
description = "Seed crate that keeps the template workspace buildable"
version = "0.1.0"
readme = "README.md"
keywords = ["oxidizer", "template"]
categories = ["development-tools"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/example_seed"

[package.metadata.docs.rs]
all-features = true

[dependencies]

[dev-dependencies]
criterion = { workspace = true }

# Callgrind benchmarks only build their Gungraun code on Linux. Keep gungraun
# out of Windows and macOS resolution so cargo-udeps does not flag it as unused.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true, features = ["default"] }

[[bench]]
name = "example_seed_sum"
harness = false

[[bench]]
name = "example_seed_sum_cg"
harness = false

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
