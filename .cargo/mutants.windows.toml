# Selected by Anvil on Windows hosts instead of mutants.toml. cargo-mutants does not
# merge configuration files, so this file repeats the shared policy.
examine_globs = ["crates/**"]
exclude_globs = [
    # Linux-only source is compiled out on Windows.
    "**/*linux.rs",
    "linux",
]
all_features = true
cap_lints = true
profile = "mutants"

# Only run unit tests and integration tests, not doctests, benchmarks or examples.
additional_cargo_test_args = ["--locked", "--tests"]

exclude_re = [
    # There are no API contracts for what these must return because they
    # are for human-readable stringification. No purpose mutating them.
    "impl Debug",
    "impl fmt::Debug",
    "impl std::fmt::Debug",
    "impl core::fmt::Debug",
]
