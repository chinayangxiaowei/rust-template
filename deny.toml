# >>> anvil-managed: anvil-deny-advisories
[advisories]
yanked = "deny"
# Scope of unmaintained-crate checks: "all" surfaces transitive
# dependencies too; tighten to "workspace" if the noise is high.
unmaintained = "all"
# <<< anvil-managed: anvil-deny-advisories

# Advisories accepted on purpose. Each entry needs a reason and, where the fix
# is out of our hands, the upstream release it waits on. Example:
#   { id = "RUSTSEC-0000-0000", reason = "no fixed release yet; tracked in owner/repo#123" },
ignore = []

# >>> anvil-managed: anvil-deny-licenses
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# <<< anvil-managed: anvil-deny-licenses

# Per-crate license exceptions beyond the allow list above. Name the crate and
# why its license is acceptable. Example:
#   { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }, # Mozilla CA data license
exceptions = []

# >>> anvil-managed: anvil-deny-bans
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# <<< anvil-managed: anvil-deny-bans

# >>> anvil-managed: anvil-deny-sources
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# <<< anvil-managed: anvil-deny-sources
