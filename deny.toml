# >>> anvil-managed: anvil-deny-advisories
[advisories]
yanked = "deny"
# Scope of unmaintained-crate checks: "all" surfaces transitive
# dependencies too; tighten to "workspace" if the noise is high.
unmaintained = "all"
# <<< anvil-managed: anvil-deny-advisories

# >>> anvil-managed: anvil-deny-licenses
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# <<< anvil-managed: anvil-deny-licenses

# Per-crate license exceptions beyond the allow list above. Name the crate and
# why its license is acceptable. Example:
#   { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }, # Mozilla CA data license
exceptions = []

# >>> anvil-managed: anvil-deny-bans
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# <<< anvil-managed: anvil-deny-bans

# >>> anvil-managed: anvil-deny-sources
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# <<< anvil-managed: anvil-deny-sources

# Accounts whose git repositories may be used as dependency sources, for forks
# patched into Cargo.toml's [patch.crates-io]. Any repository under a listed
# GitHub organization or user is allowed; list only accounts you control.
# `just rebrand apply` adds the owner from rebrand.psd1; add other accounts by
# hand. See docs/third-party-forks.md.
[sources.allow-org]
github = []
