codecov:
  notify:
    # Wait for all coverage matrix jobs to upload before reporting status.
    # Each coverage-producing OS in the `pr-test` matrix in
    # .github/workflows/anvil-pr-impl.yml does a
    # single upload (its comma-separated lcov files are merged into one report),
    # so this must equal the number of OS entries in that matrix. Without this,
    # Codecov posts the `codecov/project` status after the first upload, before
    # data from the other platforms has arrived, causing a spurious failure.
    # Keep this in sync with the number of uploading `pr-test` legs.
    after_n_builds: 3
coverage:
  precision: 1
  round: down
  range: 100..100
  status:
    project:
      default:
        target: 100
        threshold: "0"
        base: auto
# Paths excluded from coverage. Keep this list short: every entry is code whose
# coverage nobody tracks. Prefer `#[cfg_attr(coverage_nightly, coverage(off))]`
# on the specific item. Examples:
#   - "crates/my_crate_examples/**/*"   # example programs
#   - "crates/my_crate_tests/**/*"      # test-only crate
#   - "crates/my_crate/src/generated/**/*"
ignore: []
