[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["The Oxidizer Project Authors"]
license = "MIT"
homepage = "https://github.com/microsoft/oxidizer"

# Allowlist of files packaged into published crates (`cargo package`/`publish`).
# We use an explicit include (allowlist), not exclude, so that non-source
# artifacts can never leak into the published `.crate` by construction.
#
# We ship only what a dependent has to build: the library sources, its
# compile-time inputs, and the crate metadata. Examples and benchmarks are
# development code that no dependent ever builds, so they stay out.
#
# WARNING: never add a Git LFS-tracked file to a packaged path. `cargo` has no
# LFS awareness: depending on whether the publishing runner smudged LFS, an
# LFS-tracked binary is packaged either as its real bytes or as a ~130-byte
# pointer STUB. That makes the `.crate` non-reproducible, so the checksum a
# dependent records for this crate can differ from what crates.io ultimately
# stores - which breaks the dependent's build on docs.rs ("checksum changed
# between lock files"). The `.gitattributes` LFS globs (*.png, *.ico, *.jpg,
# *.pdf, *.zip, *.dll, *.exe, ...) therefore must stay OUT of every packaged
# path (src, tests, docs). Reference such assets by absolute URL instead, e.g.
# `#![doc(html_logo_url = "https://.../logo.png")]`.
#
# The `docs/**/*.md` glob matches only Markdown, so compile-time `include_str!`
# doc fragments are packaged while binary diagram assets beside them are not.
# Bolero corpus and crash files are development artifacts regardless of
# whether their targets are integration tests or private source-level tests.
include = [
    "/src/**",
    "!/src/__fuzz__/**",
    "/build.rs",
    "/tests/**",
    "!/tests/__fuzz__/**",
    "/docs/**/*.md",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE*",
]

# Adhere to the following rules when adding dependencies:
# * All dependencies specified here need to have default-features turned off - individual crates can enable the
#   features they need
# * Do not create dependency cycles involving dev-dependencies. While Cargo itself may allow this, and even
#   `cargo-release` can deal with them when path-based dependencies are used, they introduce cognitive overhead
#   and tooling uncertainties (e.g. rust-analyzer issues warnings if cycles are present). Until a strong reason
#   is found to allow cycles, we pre-emptively disallow them.
# * Crates that re-export companion proc macros must pin every supporting macro crate to their own exact version
#   (`=x.y.z`). Publish the entire family together at that same version. Before choosing the release version,
#   check the registry and increment by at least one patch if any family member already published that version.

[workspace.dependencies]
# external dependencies
criterion = { version = "0.8.2", default-features = false }
ctor = { version = "1.0.8", default-features = false, features = ["proc_macro"] }
futures = { version = "0.3.31", default-features = false }
# Keep the library aligned with gungraun-runner: `just setup-callgrind` installs the runner at this exact version.
gungraun = { version = "=0.19.4", default-features = false }
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.0", default-features = false }
prettyplease = { version = "0.3.0", default-features = false }
proc-macro2 = { version = "1.0.103", default-features = false }
serial_test = { version = "4.0.1", default-features = false }
syn = { version = "3.0.2", default-features = false }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.20", default-features = false }

# local dependencies
example_seed = { path = "crates/example_seed", default-features = false, version = "0.1.0" }
testing_aids = { path = "crates/testing_aids", default-features = false }

# >>> anvil-managed: anvil-workspace-rust-lints
[workspace.lints.rust]
# Rust compiler lint policy. Repository-specific Rust lints can follow this
# region as bare keys in the same table.
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
# `unexpected_cfgs` is on-by-default at warn since Rust 1.80; combined
# with the catalog's `-D warnings` cloud-workflow policy, any custom cfg name
# becomes a hard build failure. Pre-declare the cfgs that
# `cargo llvm-cov` sets so the recommended coverage-exclusion pattern
# `#[cfg_attr(coverage_nightly, coverage(off))]` works out of the box.
# Adopters who need additional cfg names take ownership of this one
# assignment (edit the check-cfg array); anvil's drift detector will
# emit a `.anvil-proposed` sibling on future catalog bumps so the
# customization is preserved.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
    'cfg(loom)',
    'cfg(miri_race_coverage)',
    'cfg(miri_strict_provenance)',
    'cfg(miri_tree_borrows)',
] }
# <<< anvil-managed: anvil-workspace-rust-lints

# Repository-specific Rust lint policy beyond the Anvil catalog.
missing_docs = "warn"
unreachable_pub = "warn"

# >>> anvil-managed: anvil-workspace-rustdoc-lints
[workspace.lints.rustdoc]
# Rustdoc lint policy. Repository-specific rustdoc lints can follow this
# region as bare keys in the same table.
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"
# <<< anvil-managed: anvil-workspace-rustdoc-lints

# >>> anvil-managed: anvil-workspace-clippy-lints
[workspace.lints.clippy]
# Clippy category gates use priority -1 so per-lint allows can override them.
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# Two-repo consensus (oxidizer + oxidizer-github). Restriction-group
# lints that catch real code-smell cases. Adding a workspace-wide lint
# means adopters can only opt out per-crate or by taking ownership of
# this region; only enable when the consensus is strong enough to
# justify that cost.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
multiple_unsafe_ops_per_block = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"
# Literal braces are valid data in templates and structured-logging messages.
literal_string_with_formatting_args = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
should_panic_without_expect = "allow"
significant_drop_tightening = "allow"
# Blocked by Clippy bug: https://github.com/rust-lang/rust-clippy/issues/15036
wildcard_imports = "allow"
# <<< anvil-managed: anvil-workspace-clippy-lints

# Repository-specific Clippy lint policy beyond the Anvil catalog.
panic = "warn"

# A bit of debugging support for release builds.
[profile.release]
debug = "line-tables-only"

# Best perf possible for benchmarks
[profile.bench]
lto = "fat"
codegen-units = 1

# Best debugging experience possible for test builds. Even though this is the default, we specify it explicitly,
# otherwise it appears that cargo-llvm-cov assumes different defaults which leads to only minimal debug info in
# coverage builds.
[profile.test]
debug = "full"

# No debug info for mutation testing to speed up compilation
[profile.mutants]
inherits = "test"
debug = "none"

# Profile used by `cargo bolero` (it passes `--profile fuzz` by default).
# Optimized build with single codegen unit, as recommended by cargo-bolero
# to avoid known compilation bugs in the libfuzzer instrumentation.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
